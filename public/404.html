<!doctype html>

<html lang="es">

  <head>

    <title>MiCarrera</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#6200ee">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icon-200-dark.png" type="image/png" sizes="200x200" media="(prefers-color-scheme: light)">
    <link rel="icon" href="/icon-200-light.png" type="image/png" sizes="200x200" media="(prefers-color-scheme: dark)">

    <style>

      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      body {
        font-family: Roboto, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 14px;
        color: #1f2937;
        -webkit-font-smoothing: antialiased;
      }

      header {
        width: 100%;
        height: 3.5rem;
        background: #6200ee;
        color: #fff;
        display: flex;
        align-items: center;
        padding: 0 1rem;
      }

      header .logo {
        font-size: 1.25rem;
        font-weight: 700;
        color: inherit;
        text-decoration: none;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 1rem;
        padding: 4rem 1rem;
      }

      .icon-circle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 4rem;
        height: 4rem;
        border-radius: 9999px;
        background: #f3f4f6;
      }

      .icon-circle .material-icons {
        font-size: 2.25rem;
        color: #6b7280;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        color: #111827;
      }

      p {
        color: #4b5563;
      }

      a.button {
        display: inline-flex;
        justify-content: center;
        border-radius: 0.375rem;
        background: #6200ee;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        padding: 0.5rem 1rem;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }

    </style>

  </head>

  <body>

    <!-- This file lives in public/404.html -->

    <header>
      <a class="logo" href="/">MiCarrera</a>
    </header>

    <main>
      <div class="icon-circle">
        <span class="material-icons">search_off</span>
      </div>

      <h1>No pudimos encontrar lo que buscabas</h1>
      <p>La página que estás buscando no existe.</p>

      <a class="button" href="/">Ir al inicio</a>
    </main>

  </body>

</html>
